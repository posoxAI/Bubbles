<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<style>body{margin:0}[hidden]{display:none!important}</style>
<title>Пузыри</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Comfortaa:wght@600;700&family=Nunito:wght@400;600;700&display=swap">
<style>
  /* Layout: one column as wide as the field. Rounded type for a game about bubbles; the score is the only loud figure. */
  :root {
    --bg: #EDF4F6;
    --ink: #16242B;
    --muted: #54656D;
    --line: #C3D2D8;
    --card: #F8FBFC;
    --accent: #0E7887;
    --on-accent: #FFFFFF;
    --field: #DBE8ED;
    --danger: #C4402C;
    --guide: rgba(22, 36, 43, 0.5);
    --barrel: #6F8791;
    --b1: #E0393E;
    --b2: #F2B705;
    --b3: #3AA845;
    --b4: #27CBE0;
    --b5: #2C52D6;
    --b6: #C050D0;
    --display: "Comfortaa", "Trebuchet MS", "Segoe UI", sans-serif;
    --body: "Nunito", "Segoe UI", system-ui, -apple-system, Roboto, sans-serif;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #0F181C;
      --ink: #E6EEF1;
      --muted: #93A4AC;
      --line: #27363D;
      --card: #172329;
      --accent: #5FCFDD;
      --on-accent: #062228;
      --field: #15222A;
      --danger: #FF7A66;
      --guide: rgba(230, 238, 241, 0.55);
      --barrel: #5F7780;
      --b1: #EF4E53;
      --b2: #F7C325;
      --b3: #4BBA52;
      --b4: #45DAEC;
      --b5: #4468EE;
      --b6: #D06ADF;
      color-scheme: dark;
    }
  }
  :root[data-theme="dark"] {
    --bg: #0F181C;
    --ink: #E6EEF1;
    --muted: #93A4AC;
    --line: #27363D;
    --card: #172329;
    --accent: #5FCFDD;
    --on-accent: #062228;
    --field: #15222A;
    --danger: #FF7A66;
    --guide: rgba(230, 238, 241, 0.55);
    --barrel: #5F7780;
    --b1: #EF4E53;
    --b2: #F7C325;
    --b3: #4BBA52;
    --b4: #45DAEC;
    --b5: #4468EE;
    --b6: #D06ADF;
    color-scheme: dark;
  }

  *, *::before, *::after { box-sizing: border-box; }
  body {
    background: var(--bg);
    color: var(--ink);
    font-family: var(--body);
    font-size: 16px;
    line-height: 1.45;
    padding-inline: 16px;
    padding-block: 14px 22px;
  }
  .app {
    width: min(100%, 500px, max(290px, calc((100vh - 290px) * 0.8)));
    margin-inline: auto;
    display: flex;
    flex-direction: column;
    gap: 12px;
  }
  button { font: inherit; color: inherit; }
  button:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

  .bar { display: flex; align-items: center; justify-content: space-between; gap: 10px 12px; flex-wrap: wrap; }
  h1 { margin: 0; font-family: var(--display); font-weight: 700; font-size: 20px; letter-spacing: -0.01em; }
  .btn {
    background: none;
    border: 1px solid var(--line);
    border-radius: 999px;
    padding: 5px 13px;
    font-weight: 600;
    cursor: pointer;
  }
  .btn:hover { border-color: var(--muted); }
  .btn.armed { color: var(--on-accent); background: var(--accent); border-color: var(--accent); }

  .stats { display: flex; align-items: flex-end; justify-content: space-between; gap: 10px 12px; flex-wrap: wrap; }
  .stat { display: flex; flex-direction: column; gap: 1px; min-width: 0; }
  .stat.side { align-items: flex-end; text-align: right; }
  .stat-l { font-size: 12px; font-weight: 700; letter-spacing: 0.06em; text-transform: uppercase; color: var(--muted); white-space: nowrap; }
  .stat-n { font-family: var(--display); font-weight: 700; font-size: 38px; line-height: 1; font-variant-numeric: tabular-nums; }
  .stat-n.small { font-size: 22px; line-height: 1.3; }
  .swap {
    display: flex;
    align-items: center;
    justify-content: center;
    width: 46px;
    height: 34px;
    padding: 0;
    background: none;
    border: 1px solid var(--line);
    border-radius: 999px;
    cursor: pointer;
  }
  .swap:hover { border-color: var(--muted); }
  .swap canvas { display: block; width: 26px; height: 26px; }

  .field {
    border-radius: 12px;
    user-select: none;
    -webkit-user-select: none;
    -webkit-tap-highlight-color: transparent;
    -webkit-touch-callout: none;
  }
  .field:focus { outline: none; }
  .field.kb:focus { outline: 2px solid var(--accent); outline-offset: 3px; }
  .field canvas { display: block; width: 100%; max-width: 100%; touch-action: none; cursor: crosshair; }

  .status { margin: 0; min-height: 1.45em; font-weight: 700; }
  .controls { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
  .seg { display: inline-flex; margin-left: auto; border: 1px solid var(--line); border-radius: 999px; overflow: hidden; }
  .seg button {
    font-size: 13px;
    font-weight: 700;
    letter-spacing: 0.04em;
    color: var(--muted);
    background: none;
    border: 0;
    padding: 5px 11px;
    cursor: pointer;
  }
  .seg button[aria-pressed="true"] { color: var(--on-accent); background: var(--accent); }
  .seg button:focus-visible { outline-offset: -2px; }
  .note { margin: 0; color: var(--muted); font-size: 14px; }
</style>

</head>
<body>
<div class="app">
  <header class="bar">
    <h1 id="title">Пузыри</h1>
    <button class="btn" id="newGame" type="button">Новая игра</button>
  </header>

  <div class="stats">
    <div class="stat"><span class="stat-l" id="scoreL">Счёт</span><span class="stat-n" id="score">0</span></div>
    <div class="stat side"><span class="stat-l" id="bestL">Рекорд</span><span class="stat-n small" id="best">0</span></div>
    <div class="stat side"><span class="stat-l" id="missL">До ряда</span><span class="stat-n small" id="miss">5</span></div>
    <div class="stat side"><span class="stat-l" id="nextL">Далее</span>
      <button class="swap" id="swap" type="button" aria-label="Поменять местами текущий и следующий пузырь"><canvas id="nextCv"></canvas></button>
    </div>
  </div>

  <div class="field" id="field" tabindex="0" role="application" aria-label="Игровое поле">
    <canvas id="cv"></canvas>
  </div>

  <p class="status" id="status" aria-live="polite"></p>

  <div class="controls">
    <button class="btn" id="sound" type="button" aria-pressed="true">Звук: вкл</button>
    <button class="btn" id="marks" type="button" aria-pressed="false">Значки: выкл</button>
    <span class="seg" role="group" aria-label="Язык / Language">
      <button type="button" id="langRu" aria-pressed="true">RU</button>
      <button type="button" id="langEn" aria-pressed="false">EN</button>
    </span>
  </div>

  <p class="note" id="note"></p>
</div>

<script>
(function () {
  'use strict';

  /* Field geometry, in its own units; the canvas scales it to the page. Bubbles sit in a honeycomb:
     every other row is shifted half a bubble and holds one bubble fewer. */
  var W = 330, COLS = 11, R = W / (2 * COLS), D = 2 * R, RH = R * Math.sqrt(3);
  var FIELD_ROWS = 13;                           // a bubble in row 13 or lower ends the game
  var FIELD_BOTTOM = D + (FIELD_ROWS - 1) * RH;
  var LX = W / 2, LY = FIELD_BOTTOM + 40, H = LY + R + 14;
  var SPEED = 640, COLORS = 6, START_ROWS = 6, MISS_LIMIT = 5, MIN_ANGLE = 0.16;

  var $ = function (id) { return document.getElementById(id); };
  var elField = $('field'), cv = $('cv'), ctx = cv.getContext('2d'), nextCv = $('nextCv'), nctx = nextCv.getContext('2d');
  var elStatus = $('status');
  var reduceMotion = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;

  /* ---------- storage (optional) ---------- */
  function load(key, fallback) {
    try { var v = localStorage.getItem(key); return v === null ? fallback : v; } catch (e) { return fallback; }
  }
  function save(key, value) {
    try { localStorage.setItem(key, String(value)); } catch (e) { /* storage is optional */ }
  }

  /* ---------- language ---------- */
  var STR = {
    ru: {
      title: 'Пузыри', newGame: 'Новая игра', discard: 'Сбросить счёт {n}?',
      score: 'Счёт', best: 'Рекорд', miss: 'До ряда', next: 'Далее',
      swap: 'Поменять местами текущий и следующий пузырь',
      field: 'Игровое поле. Стрелки влево и вправо наводят пушку, пробел стреляет, S меняет пузыри местами',
      soundOn: 'Звук: вкл', soundOff: 'Звук: выкл', marksOn: 'Значки: вкл', marksOff: 'Значки: выкл',
      prompt: 'Цельтесь и стреляйте. Три и больше одного цвета лопаются.',
      pop: 'Лопнуло {n}: +{p}.', popDrop: 'Лопнуло {n}, упало {d}: +{p}.',
      row: 'Сверху опустился новый ряд.',
      lost: 'Пузыри дошли до черты. Игра окончена, счёт {n}.', lostBest: 'Пузыри дошли до черты. Счёт {n}, это новый рекорд.',
      won: 'Поле очищено. Счёт {n}.', wonBest: 'Поле очищено. Счёт {n}, это новый рекорд.',
      note: 'Мышь: наведите и нажмите. Телефон: ведите пальцем, чтобы прицелиться, и отпустите. Клавиатура: стрелки, пробел, S. Пузырь отскакивает от боковых стенок. Всё, что осталось висеть без опоры, падает и приносит вдвое больше очков. Каждый выстрел, который ничего не лопнул, приближает новый ряд; на пятом он опускается сверху. Если пузыри дойдут до красной черты, игра окончена.'
    },
    en: {
      title: 'Bubbles', newGame: 'New game', discard: 'Discard score {n}?',
      score: 'Score', best: 'Best', miss: 'New row in', next: 'Next',
      swap: 'Swap the current and the next bubble',
      field: 'Playing field. Left and right arrows aim the cannon, Space shoots, S swaps the bubbles',
      soundOn: 'Sound: on', soundOff: 'Sound: off', marksOn: 'Marks: on', marksOff: 'Marks: off',
      prompt: 'Aim and shoot. Three or more of one colour pop.',
      pop: 'Popped {n}: +{p}.', popDrop: 'Popped {n}, dropped {d}: +{p}.',
      row: 'A new row came down from the top.',
      lost: 'The bubbles reached the line. Game over, score {n}.', lostBest: 'The bubbles reached the line. Score {n}, a new best.',
      won: 'Field cleared. Score {n}.', wonBest: 'Field cleared. Score {n}, a new best.',
      note: 'Mouse: point and click. Phone: drag to aim, release to shoot. Keyboard: arrow keys, Space, S. A bubble bounces off the side walls. Anything left hanging without support falls and scores double. Every shot that pops nothing brings a new row closer; on the fifth one it comes down from the top. If the bubbles reach the red line, the game is over.'
    }
  };
  // a saved choice wins; otherwise Russian for anyone who lists it among their browser languages
  function pickLang() {
    var saved = load('bubbles-lang', '');
    if (saved === 'ru' || saved === 'en') return saved;
    var list = (navigator.languages && navigator.languages.length) ? navigator.languages : [navigator.language || 'en'];
    for (var k = 0; k < list.length; k++) if (String(list[k]).toLowerCase().indexOf('ru') === 0) return 'ru';
    return 'en';
  }
  var lang = pickLang();
  function tr(key, params) {
    var text = STR[lang][key];
    if (params) for (var k in params) text = text.replace('{' + k + '}', params[k]);
    return text;
  }
  var lastSay = ['prompt', null];
  function say(key, params) { lastSay = [key, params || null]; elStatus.textContent = tr(key, params); }

  /* ---------- theme tokens for the canvas ---------- */
  var T = { balls: [] };
  function hexToRgb(h) {
    h = h.replace('#', '');
    if (h.length === 3) h = h[0] + h[0] + h[1] + h[1] + h[2] + h[2];
    var n = parseInt(h, 16);
    return [(n >> 16) & 255, (n >> 8) & 255, n & 255];
  }
  function mix(a, b, t) {
    return 'rgb(' + Math.round(a[0] + (b[0] - a[0]) * t) + ',' + Math.round(a[1] + (b[1] - a[1]) * t) + ',' + Math.round(a[2] + (b[2] - a[2]) * t) + ')';
  }
  function readTokens() {
    var cs = getComputedStyle(document.documentElement);
    ['field', 'danger', 'guide', 'barrel', 'ink', 'card', 'line'].forEach(function (k) { T[k] = cs.getPropertyValue('--' + k).trim(); });
    T.balls = [null];
    for (var k = 1; k <= COLORS; k++) {
      var rgb = hexToRgb(cs.getPropertyValue('--b' + k).trim() || '#888888');
      T.balls.push({ light: mix(rgb, [255, 255, 255], 0.5), mid: mix(rgb, [255, 255, 255], 0), dark: mix(rgb, [0, 0, 0], 0.3) });
    }
    paintNext();
  }

  /* ---------- sound ---------- */
  var actx = null;
  var soundOn = load('bubbles-sound', '1') === '1';
  var marksOn = load('bubbles-marks', '0') === '1';
  function tone(freq, dur, type, gain, delay, slideTo) {
    if (!soundOn) return;
    try {
      var AC = window.AudioContext || window.webkitAudioContext;
      if (!AC) return;
      actx = actx || new AC();
      if (actx.state === 'suspended') actx.resume();
      var t0 = actx.currentTime + (delay || 0);
      var o = actx.createOscillator(), g = actx.createGain();
      o.type = type;
      o.frequency.setValueAtTime(freq, t0);
      if (slideTo) o.frequency.exponentialRampToValueAtTime(slideTo, t0 + dur);
      g.gain.setValueAtTime(gain, t0);
      g.gain.exponentialRampToValueAtTime(0.0001, t0 + dur);
      o.connect(g); g.connect(actx.destination);
      o.start(t0); o.stop(t0 + dur + 0.02);
    } catch (e) { /* sound is optional */ }
  }

  /* ---------- state ---------- */
  var rows = [];            // rows[r][c]: 0 empty, 1..6 colour
  var shiftFirst = false;   // whether row 0 is one of the shifted, shorter rows
  var cur = 1, next = 1;    // colour in the cannon and the one after it
  var score = 0, misses = 0;
  var best = parseInt(load('bubbles-best', '0'), 10) || 0;
  var beat = false;         // this game has already passed the old best
  var state = 'aim';        // 'aim' | 'fly' | 'won' | 'lost'
  var angle = Math.PI / 2;  // aim direction: PI/2 is straight up
  var shot = null;          // { x, y, vx, vy, color }
  var pops = [], falls = [];
  var slideY = 0;           // a freshly added row slides in from above
  var kb = false, dpr = 1, scale = 1;

  function isShifted(r) { return ((r & 1) === 1) !== shiftFirst; }
  function rowLen(r) { return isShifted(r) ? COLS - 1 : COLS; }
  function bx(r, c) { return R + c * D + (isShifted(r) ? R : 0); }
  function by(r) { return R + r * RH; }
  function emptyRow() { var a = []; for (var c = 0; c < COLS; c++) a.push(0); return a; }
  function at(r, c) { return (r >= 0 && r < rows.length && c >= 0 && c < rowLen(r)) ? rows[r][c] : 0; }
  function neighbours(r, c) {
    var s = isShifted(r) ? 1 : 0, out = [];
    [[r, c - 1], [r, c + 1], [r - 1, c - 1 + s], [r - 1, c + s], [r + 1, c - 1 + s], [r + 1, c + s]].forEach(function (p) {
      if (p[0] >= 0 && p[1] >= 0 && p[1] < rowLen(p[0])) out.push(p);
    });
    return out;
  }
  function trim() { while (rows.length && rows[rows.length - 1].every(function (v) { return !v; })) rows.pop(); }
  function countBubbles() { var n = 0; rows.forEach(function (row) { row.forEach(function (v) { if (v) n++; }); }); return n; }
  function present() {
    var seen = {}, out = [];
    rows.forEach(function (row) { row.forEach(function (v) { if (v && !seen[v]) { seen[v] = 1; out.push(v); } }); });
    return out;
  }
  // the cannon only gets colours that are still on the field
  function pickColor() {
    var p = present();
    return p.length ? p[(Math.random() * p.length) | 0] : 1 + ((Math.random() * COLORS) | 0);
  }

  function newGame() {
    rows = []; shiftFirst = false;
    for (var r = 0; r < START_ROWS; r++) {
      var row = emptyRow();
      for (var c = 0; c < rowLen(r); c++) {
        // lean toward a neighbour's colour so the field starts with some groups to aim at
        var near = [];
        if (c > 0) near.push(row[c - 1]);
        if (r > 0) neighbours(r, c).forEach(function (p) { if (p[0] === r - 1 && rows[r - 1][p[1]]) near.push(rows[r - 1][p[1]]); });
        row[c] = (near.length && Math.random() < 0.42) ? near[(Math.random() * near.length) | 0] : 1 + ((Math.random() * COLORS) | 0);
      }
      rows.push(row);
    }
    score = 0; misses = 0; beat = false; state = 'aim'; shot = null; pops = []; falls = []; slideY = 0; angle = Math.PI / 2;
    cur = pickColor(); next = pickColor();
    say('prompt');
    paintHud(); persist();
  }

  /* ---------- shooting ---------- */
  function clampAngle(a) { return Math.max(MIN_ANGLE, Math.min(Math.PI - MIN_ANGLE, a)); }
  function fire() {
    if (state !== 'aim' || slideY < -0.5) return;
    shot = { x: LX, y: LY, vx: Math.cos(angle) * SPEED, vy: -Math.sin(angle) * SPEED, color: cur };
    state = 'fly';
    tone(520, 0.08, 'triangle', 0.06, 0, 300);
  }
  function swap() {
    if (state !== 'aim') return;
    var t = cur; cur = next; next = t;
    tone(440, 0.06, 'triangle', 0.05);
    paintHud();
  }

  // true when a flying bubble at (x, y) touches the ceiling or a bubble on the field
  function touches(x, y) {
    if (y <= R) return true;
    var lim = (D * 0.86) * (D * 0.86);
    for (var r = 0; r < rows.length; r++) {
      var yy = by(r) - y;
      if (yy > D || yy < -D) continue;
      for (var c = 0; c < rowLen(r); c++) {
        if (!rows[r][c]) continue;
        var xx = bx(r, c) - x;
        if (xx * xx + yy * yy < lim) return true;
      }
    }
    return false;
  }
  // the free cell nearest to where the bubble stopped, among cells that hang from something
  function landingCell(x, y) {
    var guess = Math.max(0, Math.round((y - R) / RH)), bestCell = null, bestD = Infinity;
    for (var r = Math.max(0, guess - 2); r <= guess + 2; r++) {
      for (var c = 0; c < rowLen(r); c++) {
        if (at(r, c)) continue;
        var held = r === 0 || neighbours(r, c).some(function (p) { return at(p[0], p[1]); });
        if (!held) continue;
        var dx = bx(r, c) - x, dy = by(r) - y, d2 = dx * dx + dy * dy;
        if (d2 < bestD) { bestD = d2; bestCell = [r, c]; }
      }
    }
    return bestCell;
  }
  function group(r, c) {
    var color = rows[r][c], seen = {}, out = [[r, c]], k;
    seen[r + ',' + c] = 1;
    for (k = 0; k < out.length; k++) {
      neighbours(out[k][0], out[k][1]).forEach(function (p) {
        var key = p[0] + ',' + p[1];
        if (!seen[key] && at(p[0], p[1]) === color) { seen[key] = 1; out.push(p); }
      });
    }
    return out;
  }
  // bubbles that no longer hang from the ceiling, directly or through others
  function loose() {
    var seen = {}, queue = [], out = [], r, c, k;
    if (rows.length) for (c = 0; c < rowLen(0); c++) if (rows[0][c]) { seen['0,' + c] = 1; queue.push([0, c]); }
    for (k = 0; k < queue.length; k++) {
      neighbours(queue[k][0], queue[k][1]).forEach(function (p) {
        var key = p[0] + ',' + p[1];
        if (!seen[key] && at(p[0], p[1])) { seen[key] = 1; queue.push(p); }
      });
    }
    for (r = 0; r < rows.length; r++) for (c = 0; c < rowLen(r); c++) if (rows[r][c] && !seen[r + ',' + c]) out.push([r, c]);
    return out;
  }
  function addRow() {
    shiftFirst = !shiftFirst;
    var row = emptyRow();
    for (var c = 0; c < rowLen(0); c++) row[c] = pickColor();
    rows.unshift(row);
    if (!reduceMotion) slideY = -RH;
  }
  function lowestRow() { trim(); return rows.length - 1; }

  function land(x, y) {
    var cell = landingCell(x, y), color = shot.color;
    shot = null;
    if (!cell) { state = 'aim'; return; }
    while (rows.length <= cell[0]) rows.push(emptyRow());
    rows[cell[0]][cell[1]] = color;

    var g = group(cell[0], cell[1]);
    if (g.length >= 3) {
      g.forEach(function (p) { pops.push({ x: bx(p[0], p[1]), y: by(p[0]), color: rows[p[0]][p[1]], t: 0 }); rows[p[0]][p[1]] = 0; });
      var l = loose();
      l.forEach(function (p) { falls.push({ x: bx(p[0], p[1]), y: by(p[0]), vy: -40 - Math.random() * 60, vx: (Math.random() - 0.5) * 40, color: rows[p[0]][p[1]] }); rows[p[0]][p[1]] = 0; });
      var gain = g.length * 10 + l.length * 20;
      score += gain;
      if (score > best) { best = score; beat = true; save('bubbles-best', best); }
      if (l.length) say('popDrop', { n: g.length, d: l.length, p: gain }); else say('pop', { n: g.length, p: gain });
      for (var k = 0; k < Math.min(5, g.length); k++) tone(620 + k * 90, 0.09, 'sine', 0.06, k * 0.035);
      if (l.length) tone(300, 0.3, 'triangle', 0.06, 0.12, 120);
    } else {
      misses++;
      tone(200, 0.07, 'sine', 0.06);
      if (misses >= MISS_LIMIT) { misses = 0; addRow(); say('row'); tone(150, 0.2, 'square', 0.04); }
      else if (lastSay[0] !== 'prompt') say('prompt');
    }

    trim();
    if (!countBubbles()) {
      state = 'won';
      say(beat ? 'wonBest' : 'won', { n: score });
      [523, 659, 784, 1047].forEach(function (f, n) { tone(f, 0.22, 'triangle', 0.08, 0.2 + n * 0.09); });
    } else if (lowestRow() >= FIELD_ROWS) {
      state = 'lost';
      say(beat ? 'lostBest' : 'lost', { n: score });
      tone(260, 0.5, 'sawtooth', 0.07, 0.1, 80);
    } else {
      state = 'aim';
      cur = next;
      var p = present();
      if (p.indexOf(cur) < 0) cur = pickColor();
      next = pickColor();
    }
    paintHud(); persist();
  }

  function update(dt) {
    var k;
    if (slideY < 0) { slideY += Math.max(1, -slideY) * Math.min(1, dt * 16); if (slideY > -0.4) slideY = 0; }
    if (state === 'fly' && shot) {
      var steps = Math.max(1, Math.ceil(SPEED * dt / (R * 0.35))), h = dt / steps;
      for (k = 0; k < steps && shot; k++) {
        shot.x += shot.vx * h; shot.y += shot.vy * h;
        if (shot.x < R) { shot.x = 2 * R - shot.x; shot.vx = -shot.vx; }
        else if (shot.x > W - R) { shot.x = 2 * (W - R) - shot.x; shot.vx = -shot.vx; }
        if (touches(shot.x, shot.y)) land(shot.x, shot.y);
      }
    }
    for (k = pops.length - 1; k >= 0; k--) { pops[k].t += dt; if (pops[k].t > 0.2) pops.splice(k, 1); }
    for (k = falls.length - 1; k >= 0; k--) {
      var f = falls[k];
      f.vy += 1500 * dt; f.y += f.vy * dt; f.x += f.vx * dt;
      if (f.y > H + D) falls.splice(k, 1);
    }
  }

  /* ---------- HUD ---------- */
  function paintHud() {
    $('score').textContent = score;
    $('best').textContent = best;
    $('miss').textContent = MISS_LIMIT - misses;
    $('swap').disabled = state !== 'aim' && state !== 'fly';
    paintNext();
  }
  function paintNext() {
    if (!T.balls.length) return;
    var d = Math.min(window.devicePixelRatio || 1, 2.5);
    nextCv.width = Math.round(26 * d); nextCv.height = Math.round(26 * d);
    nctx.setTransform(d, 0, 0, d, 0, 0);
    nctx.clearRect(0, 0, 26, 26);
    drawBubble(nctx, 13, 13, 11.5, next, 1);
  }
  function paintOpts() {
    $('sound').textContent = soundOn ? tr('soundOn') : tr('soundOff');
    $('sound').setAttribute('aria-pressed', soundOn ? 'true' : 'false');
    $('marks').textContent = marksOn ? tr('marksOn') : tr('marksOff');
    $('marks').setAttribute('aria-pressed', marksOn ? 'true' : 'false');
  }
  function applyLang() {
    document.documentElement.lang = lang;
    document.title = tr('title');
    $('title').textContent = tr('title');
    $('scoreL').textContent = tr('score');
    $('bestL').textContent = tr('best');
    $('missL').textContent = tr('miss');
    $('nextL').textContent = tr('next');
    $('swap').setAttribute('aria-label', tr('swap'));
    elField.setAttribute('aria-label', tr('field'));
    $('note').textContent = tr('note');
    $('langRu').setAttribute('aria-pressed', lang === 'ru' ? 'true' : 'false');
    $('langEn').setAttribute('aria-pressed', lang === 'en' ? 'true' : 'false');
    elStatus.textContent = tr(lastSay[0], lastSay[1]);
    disarm();
    paintOpts();
  }
  function setLang(v) {
    if (v === lang) return;
    lang = v;
    save('bubbles-lang', lang);
    applyLang();
  }

  /* ---------- drawing ---------- */
  function resize() {
    var w = elField.clientWidth || 330;
    dpr = Math.min(window.devicePixelRatio || 1, 2.5);
    scale = w / W;
    cv.style.height = Math.round(w * H / W) + 'px';
    cv.width = Math.round(w * dpr);
    cv.height = Math.round(w * H / W * dpr);
  }
  function drawMark(c, r, color) {
    var m = r * 0.42;
    c.save();
    c.strokeStyle = 'rgba(255,255,255,0.95)'; c.fillStyle = 'rgba(255,255,255,0.95)';
    c.shadowColor = 'rgba(0,0,0,0.45)'; c.shadowBlur = r * 0.18;
    c.lineWidth = Math.max(1.2, r * 0.17); c.lineCap = 'round'; c.lineJoin = 'round';
    c.beginPath();
    if (color === 1) { c.arc(0, 0, m * 0.5, 0, 6.2832); c.fill(); }
    else if (color === 2) { c.arc(0, 0, m * 0.85, 0, 6.2832); c.stroke(); }
    else if (color === 3) { c.moveTo(-m, 0); c.lineTo(m, 0); c.moveTo(0, -m); c.lineTo(0, m); c.stroke(); }
    else if (color === 4) { c.moveTo(-m * 0.8, -m * 0.8); c.lineTo(m * 0.8, m * 0.8); c.moveTo(m * 0.8, -m * 0.8); c.lineTo(-m * 0.8, m * 0.8); c.stroke(); }
    else if (color === 5) { c.rect(-m * 0.75, -m * 0.75, m * 1.5, m * 1.5); c.stroke(); }
    else { c.moveTo(0, -m * 0.95); c.lineTo(m * 0.9, m * 0.7); c.lineTo(-m * 0.9, m * 0.7); c.closePath(); c.stroke(); }
    c.restore();
  }
  function drawBubble(c, x, y, r, color, k) {
    var b = T.balls[color];
    if (!b || k <= 0.02) return;
    r *= k;
    c.save();
    c.translate(x, y);
    var g = c.createRadialGradient(-r * 0.3, -r * 0.35, r * 0.1, 0, 0, r);
    g.addColorStop(0, b.light); g.addColorStop(0.6, b.mid); g.addColorStop(1, b.dark);
    c.fillStyle = g;
    c.beginPath(); c.arc(0, 0, r - 0.4, 0, 6.2832); c.fill();
    // the bright crescent that makes it read as a bubble
    c.strokeStyle = 'rgba(255,255,255,0.7)'; c.lineWidth = Math.max(1, r * 0.13); c.lineCap = 'round';
    c.beginPath(); c.arc(0, 0, r * 0.66, Math.PI * 1.08, Math.PI * 1.42); c.stroke();
    if (marksOn) drawMark(c, r, color);
    c.restore();
  }
  // dotted preview of the flight: stops at the first bubble or after a fixed length
  function drawGuide() {
    var x = LX, y = LY, dx = Math.cos(angle), dy = -Math.sin(angle), step = 4, travelled = 0;
    ctx.fillStyle = T.guide;
    while (travelled < 250) {
      x += dx * step; y += dy * step; travelled += step;
      if (x < R) { x = 2 * R - x; dx = -dx; } else if (x > W - R) { x = 2 * (W - R) - x; dx = -dx; }
      if (travelled > R * 1.4 && touches(x, y)) break;
      if (travelled > R * 1.4 && travelled % 12 === 0) { ctx.beginPath(); ctx.arc(x, y, 1.7, 0, 6.2832); ctx.fill(); }
    }
  }
  function draw() {
    var r, c;
    ctx.setTransform(dpr * scale, 0, 0, dpr * scale, 0, 0);
    ctx.clearRect(0, 0, W, H);
    ctx.fillStyle = T.field;
    ctx.beginPath();
    if (ctx.roundRect) ctx.roundRect(0, 0, W, H, 10); else ctx.rect(0, 0, W, H);
    ctx.fill();

    // the line the bubbles must not reach
    ctx.strokeStyle = T.danger; ctx.lineWidth = 1.5; ctx.setLineDash([6, 5]);
    ctx.beginPath(); ctx.moveTo(6, FIELD_BOTTOM + 3); ctx.lineTo(W - 6, FIELD_BOTTOM + 3); ctx.stroke();
    ctx.setLineDash([]);

    ctx.save();
    ctx.beginPath(); ctx.rect(0, 0, W, H); ctx.clip();
    for (r = 0; r < rows.length; r++) for (c = 0; c < rowLen(r); c++) if (rows[r][c]) drawBubble(ctx, bx(r, c), by(r) + slideY, R, rows[r][c], 1);
    ctx.restore();

    if (state === 'aim') drawGuide();

    // cannon: a base, a barrel along the aim, the loaded bubble on top
    var ax = Math.cos(angle), ay = -Math.sin(angle);
    ctx.strokeStyle = T.barrel; ctx.lineWidth = R * 1.25; ctx.lineCap = 'round';
    ctx.beginPath(); ctx.moveTo(LX, LY); ctx.lineTo(LX + ax * R * 1.9, LY + ay * R * 1.9); ctx.stroke();
    ctx.fillStyle = T.barrel;
    ctx.beginPath(); ctx.arc(LX, LY, R * 1.25, 0, 6.2832); ctx.fill();
    if (state === 'aim') drawBubble(ctx, LX, LY, R * 0.92, cur, 1);

    if (shot) drawBubble(ctx, shot.x, shot.y, R, shot.color, 1);
    for (c = 0; c < pops.length; c++) drawBubble(ctx, pops[c].x, pops[c].y, R, pops[c].color, 1 - pops[c].t / 0.2);
    for (c = 0; c < falls.length; c++) drawBubble(ctx, falls[c].x, falls[c].y, R, falls[c].color, 1);
  }

  var last = 0;
  function frame(ts) {
    var dt = Math.min(0.033, (ts - last) / 1000 || 0);
    last = ts;
    update(dt);
    draw();
    requestAnimationFrame(frame);
  }

  /* ---------- input ---------- */
  function setKb(on) { kb = on; elField.classList.toggle('kb', on); }
  function aimAt(e) {
    var rect = cv.getBoundingClientRect();
    var x = (e.clientX - rect.left) / rect.width * W, y = (e.clientY - rect.top) / rect.height * H;
    // below the cannon there is nothing to aim at, so keep the last direction
    if (y > LY - 4) return false;
    angle = clampAngle(Math.atan2(LY - y, x - LX));
    return true;
  }
  var pressing = false;
  cv.addEventListener('pointerdown', function (e) {
    if (e.button !== undefined && e.button !== 0) return;
    setKb(false);
    pressing = true;
    aimAt(e);
    try { cv.setPointerCapture(e.pointerId); } catch (err) { /* capture is a convenience */ }
    e.preventDefault();
  });
  cv.addEventListener('pointermove', function (e) {
    if (e.pointerType === 'mouse' || pressing) aimAt(e);
  });
  cv.addEventListener('pointerup', function (e) {
    if (!pressing) return;
    pressing = false;
    if (aimAt(e)) fire();
  });
  cv.addEventListener('pointercancel', function () { pressing = false; });

  elField.addEventListener('keydown', function (e) {
    var used = true, stepA = e.shiftKey ? 0.008 : 0.035;
    if (e.key === 'ArrowLeft') angle = clampAngle(angle + stepA);
    else if (e.key === 'ArrowRight') angle = clampAngle(angle - stepA);
    else if (e.key === ' ' || e.key === 'Enter' || e.key === 'ArrowUp') { if (!e.repeat) fire(); }
    else if (e.code === 'KeyS' || e.key === 'ArrowDown') { if (!e.repeat) swap(); }
    else used = false;
    if (!used) return;
    e.preventDefault();
    setKb(true);
  });

  var armTimer = 0;
  function disarm() { $('newGame').classList.remove('armed'); $('newGame').textContent = tr('newGame'); clearTimeout(armTimer); }
  $('newGame').addEventListener('click', function () {
    var b = $('newGame');
    // an unfinished game with points asks once before it is thrown away
    if ((state === 'aim' || state === 'fly') && score > 0 && !b.classList.contains('armed')) {
      b.classList.add('armed');
      b.textContent = tr('discard', { n: score });
      armTimer = setTimeout(disarm, 3500);
      return;
    }
    disarm();
    newGame();
  });
  $('swap').addEventListener('click', swap);
  $('sound').addEventListener('click', function () {
    soundOn = !soundOn; save('bubbles-sound', soundOn ? '1' : '0'); paintOpts();
    if (soundOn) tone(523, 0.12, 'triangle', 0.08);
  });
  $('marks').addEventListener('click', function () {
    marksOn = !marksOn; save('bubbles-marks', marksOn ? '1' : '0'); paintOpts(); paintNext();
  });
  $('langRu').addEventListener('click', function () { setLang('ru'); });
  $('langEn').addEventListener('click', function () { setLang('en'); });

  /* ---------- persistence ---------- */
  function snapshot() {
    if (state !== 'aim' && state !== 'fly') return {};
    return { rows: rows.map(function (r) { return r.slice(); }), shiftFirst: shiftFirst, cur: cur, next: next, score: score, misses: misses, beat: beat };
  }
  function persist() { save('bubbles-state', JSON.stringify(snapshot())); }
  function okColor(v) { return v === (v | 0) && v >= 1 && v <= COLORS; }
  function restore(d) {
    if (!d || !Array.isArray(d.rows) || !d.rows.length || d.rows.length > FIELD_ROWS) return false;
    var good = d.rows.every(function (r) { return Array.isArray(r) && r.length === COLS && r.every(function (v) { return v === 0 || okColor(v); }); });
    if (!good || !okColor(d.cur) || !okColor(d.next) || !(d.score >= 0) || !(d.misses >= 0 && d.misses < MISS_LIMIT)) return false;
    rows = d.rows.map(function (r) { return r.slice(); });
    shiftFirst = !!d.shiftFirst;
    // a shifted row has no last cell
    for (var r = 0; r < rows.length; r++) if (isShifted(r)) rows[r][COLS - 1] = 0;
    trim();
    if (!countBubbles() || loose().length) return false;
    cur = d.cur; next = d.next; score = Math.floor(d.score); misses = d.misses; beat = !!d.beat;
    state = 'aim'; shot = null; pops = []; falls = []; slideY = 0; angle = Math.PI / 2;
    say('prompt');
    return true;
  }

  /* ---------- boot ---------- */
  function boot(data) {
    if (!data || !data.rows) {
      try { data = JSON.parse(load('bubbles-state', 'null')); } catch (e) { data = null; }
    }
    readTokens();
    resize();
    if (!restore(data)) newGame();
    applyLang();
    paintHud();
    requestAnimationFrame(frame);
  }

  if (window.matchMedia) {
    var mq = window.matchMedia('(prefers-color-scheme: dark)');
    if (mq.addEventListener) mq.addEventListener('change', readTokens);
  }
  new MutationObserver(readTokens).observe(document.documentElement, { attributes: true, attributeFilter: ['data-theme'] });
  if (window.ResizeObserver) new ResizeObserver(resize).observe(elField);
  window.addEventListener('resize', resize);

  var hot = window.claude && window.claude.hot;
  try { if (hot && hot.snapshot) hot.snapshot(snapshot); } catch (e) { /* no viewer hook */ }
  if (hot && hot.ready) hot.ready(boot); else boot((hot && hot.data) || null);
})();
</script>
